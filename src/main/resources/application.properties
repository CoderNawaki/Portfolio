spring.application.name=portfolio-app
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:portfoliodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}


portfolio.admin.username=${PORTFOLIO_ADMIN_USERNAME}
portfolio.admin.password=${PORTFOLIO_ADMIN_PASSWORD}

portfolio.display-name=Lama Nawaraj
portfolio.role=Full Stack Developer
portfolio.location=Working mainly in Japan
portfolio.site-url=${PORTFOLIO_SITE_URL:http://localhost:8081}
portfolio.github-url=https://github.com/CoderNawaki
portfolio.email=lama.nawraj00@gmail.com
portfolio.resume-label=Resume available on request
portfolio.availability=Open to Java-first full stack roles where Spring Boot, testing, documentation, and steady delivery matter.
portfolio.blog-publication-notification-message=A new article is live on the blog.

portfolio.contact.notification-email=${PORTFOLIO_CONTACT_NOTIFICATION_EMAIL:lama.nawraj00@gmail.com}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.sampler=always-on
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

portfolio.focus-areas=Spring Boot application structure and backend delivery, Frontend implementation with HTML, CSS, JavaScript, and React, Design documents, testing, and release-ready development, Japanese and English communication in engineering teams
portfolio.proof-points=Working mainly in Japan, Java-first full stack positioning, Bridge engineer communication, Documentation and tests included in delivery
portfolio.bio=Java-first full stack developer working mainly in Japan. Experienced in design documentation, implementation, testing, and cross-language engineering support. I focus on building maintainable Spring Boot applications, practical frontend flows, and reviewable work that hiring teams can evaluate quickly.

